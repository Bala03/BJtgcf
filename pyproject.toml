[tool.poetry]
name = "tgcf"
version = "0.3.0"
description = "The ultimate tool to automate custom telegram message forwarding."
authors = ["aahnik <daw@aahnik.dev>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/aahnik/tgcf"
documentation = "https://github.com/aahnik/tgcf/wiki"

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
typer = "^0.12.0"
python-dotenv = "^1.0.0"
PyYAML = "^6.0"
pydantic = "^2.0"
Telethon = "^1.36"
cryptg = "^0.4"
Pillow = "^10.0"
hachoir = "^3.3"
aiohttp = "^3.9"
tg-login = "^0.0.4"
"watermark.py" = "^0.0.3"
pytesseract = "^0.3.10"
rich = "^13.0"
pyfiglet = "^1.0"

[tool.poetry.dev-dependencies]
black = "^24.0"
isort = "^5.13"
pre-commit = "^3.7"


[tool.poetry.scripts]
tgcf = 'tgcf.cli:app'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
profile = "black"

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''
